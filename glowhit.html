<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowHit | 智慧模組化光點反應牆</title>
    <link class="brand-favicon" rel="icon" href="assets/icons/LOGO.png" type="image/png">
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/simulator.css">
    <link rel="stylesheet" href="css/animations.css">

    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SK3WC44J9Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SK3WC44J9Q');
    </script>
</head>
<body class="overflow-x-hidden antialiased bg-gray-50/50">

    <!-- Navigation Bar -->
    <nav class="glass-nav fixed w-full top-0 z-50 border-b border-gray-200/80 px-3 sm:px-6 py-2.5 sm:py-3 flex justify-between items-center transition-all duration-300">
        <div class="flex items-center space-x-2 sm:space-x-3 cursor-pointer group" onclick="navigate('home')">
            <img src="assets/icons/LOGO.png" alt="GlowHit Logo" class="w-8 h-8 sm:w-10 sm:h-10 object-contain transform transition-transform group-hover:scale-105 duration-300">
            <span class="text-lg sm:text-xl font-bold tracking-tight text-gray-900 group-hover:text-indigo-600 transition-colors">GlowHit</span>
        </div>
        
        <!-- Desktop Nav Links -->
        <div class="hidden md:flex space-x-8 text-sm font-medium tracking-wide">
            <span class="nav-link text-gray-500 hover:text-black transition cursor-pointer" id="nav-home" onclick="navigate('home')">Home</span>
            <span class="nav-link text-gray-500 hover:text-black transition cursor-pointer" id="nav-product" onclick="navigate('product')">Product</span>
            <span class="nav-link text-gray-500 hover:text-black transition cursor-pointer" id="nav-simulator" onclick="navigate('simulator')">Simulator</span>
            <span class="nav-link text-gray-500 hover:text-black transition cursor-pointer" id="nav-vision" onclick="navigate('vision')">Vision</span>
            <span class="nav-link text-gray-500 hover:text-black transition cursor-pointer" id="nav-brand" onclick="navigate('brand')">Brand</span>
            <span class="nav-link text-gray-500 hover:text-black transition cursor-pointer" id="nav-video" onclick="navigate('video')">Video</span>
        </div>

        <!-- Language Selector & Actions -->
        <div class="flex items-center space-x-2 sm:space-x-3">
            <div class="flex items-center space-x-1 sm:space-x-1.5 border border-gray-200 rounded-full px-2 sm:px-3 py-1 bg-white shadow-xs hover:border-gray-300 transition-colors">
                <i data-lucide="globe" class="w-3.5 h-3.5 text-gray-500 shrink-0"></i>
                <span class="text-[11px] sm:text-xs font-semibold text-gray-600 tracking-tight shrink-0">Language</span>
                <span class="text-gray-300 text-[10px] sm:text-xs">|</span>
                <select id="langSelect" onchange="changeLanguage()" class="bg-transparent text-[11px] sm:text-xs font-medium outline-none cursor-pointer text-gray-700 max-w-[70px] sm:max-w-none">
                    <option value="zh-TW">繁體中文</option>
                    <option value="en">English</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="pt">Português</option> <!-- 補回 PT -->
                    <option value="ar">العربية</option>   <!-- 補回 AR -->
                </select>
            </div>
            
            <button onclick="navigate('simulator')" id="globalCtaBtn" class="hidden sm:inline-flex items-center text-xs font-semibold px-4 py-1.5 rounded-full apple-btn-primary shadow-xs">
                試玩體驗
            </button>

            <!-- Mobile Hamburger Button -->
            <button onclick="toggleMobileMenu()" class="md:hidden p-1 text-gray-600 hover:text-black focus:outline-none" aria-label="Toggle Menu">
                <span id="menuIconContainer"><i data-lucide="menu" class="w-5 h-5 sm:w-6 sm:h-6"></i></span>
            </button>
        </div>
    </nav>

    <!-- Mobile Fullscreen Overlay -->
    <div id="mobileMenu" class="hidden fixed inset-x-0 top-[57px] bottom-0 z-40 glass-nav border-b border-gray-200 md:hidden flex flex-col px-8 py-8 space-y-6 text-lg font-medium">
        <span class="mob-nav-link text-gray-600 py-2 border-b border-gray-100" id="mob-nav-home" onclick="navigate('home'); toggleMobileMenu();">Home</span>
        <span class="mob-nav-link text-gray-600 py-2 border-b border-gray-100" id="mob-nav-product" onclick="navigate('product'); toggleMobileMenu();">Product</span>
        <span class="mob-nav-link text-gray-600 py-2 border-b border-gray-100" id="mob-nav-simulator" onclick="navigate('simulator'); toggleMobileMenu();">Simulator</span>
        <span class="mob-nav-link text-gray-600 py-2 border-b border-gray-100" id="mob-nav-vision" onclick="navigate('vision'); toggleMobileMenu();">Vision</span>
        <span class="mob-nav-link text-gray-600 py-2 border-b border-gray-100" id="mob-nav-brand" onclick="navigate('brand'); toggleMobileMenu();">Brand</span>
        <span class="mob-nav-link text-gray-600 py-2 border-b border-gray-100" id="mob-nav-video" onclick="navigate('video'); toggleMobileMenu();">Video</span>
    </div>

    <!-- Main Content Mount -->
    <main id="app" class="pt-20 pb-16 min-h-screen"></main>

    <!-- Global Footer -->
    <footer class="bg-white border-t border-gray-100 py-12 px-6">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center text-xs text-gray-500 space-y-4 md:space-y-0">
            <div>
                <p class="font-semibold text-gray-800" id="footerTitle">GlowHit 智慧模組化光點反應牆專案</p>
                <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1">
                    <span id="footerCopyright">© 2026 Glowhit. 保留所有權利。</span>
                    <span class="text-gray-300 hidden sm:inline">|</span>
                    <a href="https://dctpro.com/tw/" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:text-indigo-700 font-medium transition-colors">DCT PRO</a>
                </div>
            </div>
            <div class="flex space-x-6 text-gray-400 font-medium">
                <span class="hover:text-gray-700 cursor-pointer transition-colors" onclick="navigate('product')">硬體細節</span>
                <span class="hover:text-gray-700 cursor-pointer transition-colors" onclick="navigate('vision')">核心初衷</span>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script>window.translations = {};</script>
    <!-- 確保這裡有引入所有語系的字典檔 -->
    <script src="js/data/zh-tw.js"></script>
    <script src="js/data/en.js"></script>
    <script src="js/data/zh-cn.js"></script>
    <script src="js/data/ja.js"></script>
    <script src="js/data/ko.js"></script>
    <script src="js/data/es.js"></script>
    <script src="js/data/fr.js"></script>
    <script src="js/data/de.js"></script>
    <script src="js/data/pt.js"></script> <!-- 如果有新增字典檔記得匯入 -->
    <script src="js/data/ar.js"></script> <!-- 如果有新增字典檔記得匯入 -->

    <script src="js/components/navbar.js"></script>
    <script src="js/components/language-switcher.js"></script>
    <script src="js/services/leaderboard.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/product.js"></script>
    <script src="js/pages/simulator.js"></script>
    <script src="js/pages/vision.js"></script> 
    <script src="js/pages/brand.js"></script>
    <script src="js/pages/video.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
