<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/components.css">

<body class="overflow-x-hidden antialiased bg-gray-50/50">

    <!-- Translucent Navigation Bar -->
    <nav class="glass-nav fixed w-full top-0 z-50 transition-all duration-300 px-4 md:px-8 py-3.5 flex justify-between items-center">
        <div class="flex items-center space-x-3.5 cursor-pointer group" onclick="navigate('home')">
            <img src="assets/icons/LOGO.png" alt="GlowHit Logo" class="w-10 h-10 object-contain transform transition-transform group-hover:scale-105 duration-300">
            <span class="text-xl font-bold tracking-tight text-gray-900 group-hover:text-indigo-600 transition-colors">GlowHit</span>
        </div>
        
        <!-- Desktop Menu -->
        <div class="hidden md:flex space-x-8 text-sm font-medium tracking-wide">
            <span class="nav-link text-gray-500 hover:text-black transition cursor-pointer" id="nav-home" onclick="navigate('home')">Home</span>

        <div class="flex items-center space-x-3 md:space-x-4">
            <div class="flex items-center space-x-1.5 border border-gray-200/80 rounded-full px-3 py-1 bg-white/80 shadow-sm">
                <i data-lucide="globe" class="w-3.5 h-3.5 text-gray-500"></i>
                <select id="langSelect" onchange="changeLanguage()" class="bg-transparent text-xs font-medium outline-none cursor-pointer text-gray-700">
                    <option value="zh-TW">繁體中文</option>
                    <option value="en">English</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="es">Español</option>

                    <option value="fr">Français</option>
                    <option value="pt">Português</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
            
            <button onclick="navigate('simulator')" id="globalCtaBtn" class="hidden sm:inline-flex items-center text-xs font-semibold px-4.5 py-2 rounded-full apple-btn-primary shadow-sm">
                試玩體驗
            </button>

            <!-- Mobile Menu Btn -->
            <button onclick="toggleMobileMenu()" class="md:hidden p-1.5 text-gray-600 hover:text-black focus:outline-none">
                <span id="menuIconContainer"><i data-lucide="menu" class="w-6 h-6"></i></span>
            </button>
        </div>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div id="mobileMenu" class="hidden fixed inset-x-0 top-[65px] bottom-0 z-40 glass-nav md:hidden flex flex-col px-8 py-8 space-y-6 text-lg font-medium transform -translate-y-8 opacity-0 transition-all duration-300">
        <span class="mob-nav-link text-gray-600 hover:text-black transition cursor-pointer py-2 border-b border-gray-100" id="mob-nav-home" onclick="navigate('home'); toggleMobileMenu();">Home</span>
        <span class="mob-nav-link text-gray-600 hover:text-black transition cursor-pointer py-2 border-b border-gray-100" id="mob-nav-product" onclick="navigate('product'); toggleMobileMenu();">Product</span>

        <span class="mob-nav-link text-gray-600 hover:text-black transition cursor-pointer py-2 border-b border-gray-100" id="mob-nav-brand" onclick="navigate('brand'); toggleMobileMenu();">Brand</span>
        <span class="mob-nav-link text-gray-600 hover:text-black transition cursor-pointer py-2 border-b border-gray-100" id="mob-nav-video" onclick="navigate('video'); toggleMobileMenu();">Video</span>

    <!-- JS Files -->
    <script>window.translations = {};</script>
    <script src="js/data/zh-tw.js"></script>
    
    <script src="js/components/navbar.js"></script>
    <script src="js/components/language-switcher.js"></script>
    
    <script src="js/pages/home.js"></script>
    <script src="js/pages/product.js"></script>
    <script src="js/pages/simulator.js"></script>
    <script src="js/pages/vision.js"></script> 
    <script src="js/pages/brand.js"></script>
