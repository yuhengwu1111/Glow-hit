    <meta charset="UTF-8">

    <title>GlowHit Global Leaderboard | 極限反應英雄榜</title>
    <link rel="icon" href="assets/icons/LOGO.png" type="image/png">
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        .glow-gold { box-shadow: 0 10px 30px -5px rgba(245, 158, 11, 0.25); }
        .glow-silver { box-shadow: 0 10px 25px -5px rgba(156, 163, 175, 0.2); }
        .glow-bronze { box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.2); }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 via-slate-100 to-indigo-50/40 min-h-screen text-gray-900 pb-16 antialiased">

    <!-- 頂部資訊與導覽列 -->
    <header class="border-b border-gray-200/80 bg-white/80 backdrop-blur-md sticky top-0 z-30 px-4 sm:px-8 py-3">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
            <!-- 品牌與返回主站 -->
            <div class="flex items-center space-x-3 cursor-pointer group" onclick="location.href='glowhit.html'">
                <img src="assets/icons/LOGO.png" alt="Logo" class="w-8 h-8 object-contain transform group-hover:scale-105 transition-transform">
                <div>
                    <h1 class="text-base font-extrabold tracking-tight text-gray-900 leading-none flex items-center gap-1.5">
                        <span>GlowHit</span>
                        <span class="text-[10px] px-1.5 py-0.2 rounded bg-indigo-50 text-indigo-600 font-bold border border-indigo-100 hidden sm:inline-block" id="ui-live-badge">GLOBAL</span>
                    </h1>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-indigo-600" id="ui-sub-brand">LEADERBOARD</span>
                </div>
            </div>

            <!-- 控制區：10 國語言選擇、即時連線燈、手動刷新 -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- 10 國語言切換下拉選單 -->
                <div class="flex items-center space-x-1 border border-gray-200 rounded-full px-2 sm:px-3 py-1 bg-white shadow-2xs">
                    <i data-lucide="globe" class="w-3.5 h-3.5 text-gray-500 shrink-0"></i>
                    <select id="langSelect" onchange="switchLanguage(this.value)" class="bg-transparent text-[11px] sm:text-xs font-medium outline-none cursor-pointer text-gray-700">
                        <option value="zh-TW">繁體中文</option>
                        <option value="en">English</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="pt">Português</option>
                        <option value="ar">العربية</option>
                    </select>
                </div>

                <!-- 即時動態倒數指示器 -->
                <div class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="ui-live-text">LIVE</span>
                    <span id="autoTimer" class="text-[10px] text-emerald-600/80 font-mono ml-0.5">15s</span>
                </div>

                <!-- 手動刷新按鈕 -->
                <button onclick="fetchLeaderboardData()" class="p-1.5 rounded-full hover:bg-gray-100 text-gray-600 transition-colors cursor-pointer" title="Refresh">
                    <i data-lucide="refresh-cw" class="w-4 h-4" id="refreshIcon"></i>
                </button>
            </div>
        </div>
    </header>

            <h2 id="ui-main-title" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-900">全球反應英雄榜</h2>
            <p id="ui-main-subtitle" class="text-xs sm:text-sm text-gray-500 mt-2">即時同步全球挑戰者與 ESP32 硬體連線成績</p>

                <button onclick="changeMode('speed')" id="tab-speed" class="px-4 sm:px-5 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer whitespace-nowrap">⚡ 光速反應</button>

                <button onclick="changeMode('hunt')" id="tab-hunt" class="px-4 sm:px-5 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer whitespace-nowrap">🎯 光影追獵</button>
            </div>
        </div>

        <!-- 🏆 前三名頒獎台 (Podium) -->
        <div id="podiumContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 items-end max-w-4xl mx-auto"></div>

        <!-- 📊 完整排行榜清單 (第 4 名以後) -->

            <div class="flex items-center justify-between pb-3 border-b border-gray-100 text-xs font-bold text-gray-400 px-3">
                <span id="ui-th-user">名次 / 挑戰者</span>
                <span id="ui-th-score">成績 / 反應時間</span>
            </div>
            <div id="boardList" class="divide-y divide-gray-100 mt-1">
                <div class="py-12 text-center text-gray-400 text-sm" id="ui-loading-text">載入即時戰況中...</div>
            </div>
        </div>
    </main>

        let currentMode = 'speed';
        let refreshSeconds = 15;
        let countdownInterval = null;
        let lastScoresData = [];

        function parseCountryCode(countryStr) {
            if (!countryStr) return 'un';
            const clean = countryStr.toLowerCase().trim();
            if (clean.length === 2) return clean;
            const match = clean.match(/\b([a-z]{2})\b/);
            return (match && match[1]) ? match[1] : 'un';
        }

        function switchLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('glowhit_lang', lang);
            
            // RTL 佈局判定（阿拉伯語支援）
            document.getElementById('htmlRoot').dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.getElementById('langSelect').value = lang;

            applyLanguageTexts();
            renderPodium(lastScoresData.slice(0, 3));
            renderList(lastScoresData.slice(3, 20));
        }

        function applyLanguageTexts() {
            const t = I18N[currentLang] || I18N['en'];
            document.getElementById('ui-main-title').textContent = t.mainTitle;
            document.getElementById('ui-main-subtitle').textContent = t.mainSubtitle;
            document.getElementById('tab-speed').textContent = t.tabSpeed;
            document.getElementById('tab-color').textContent = t.tabColor;
            document.getElementById('tab-hunt').textContent = t.tabHunt;
            document.getElementById('ui-th-user').textContent = t.thUser;
            document.getElementById('ui-th-score').textContent = t.thScore;
            
            const loadText = document.getElementById('ui-loading-text');
            if (loadText) loadText.textContent = t.loading;
        }

        function changeMode(mode) {
            currentMode = mode;
            ['speed', 'color', 'hunt'].forEach(m => {
                const btn = document.getElementById(`tab-${m}`);
                if (btn) {
                    btn.className = (m === mode)
                        ? "px-4 sm:px-5 py-2 rounded-xl text-xs font-bold bg-white text-indigo-600 shadow-sm cursor-pointer whitespace-nowrap"
                        : "px-4 sm:px-5 py-2 rounded-xl text-xs font-semibold text-gray-600 hover:text-gray-900 cursor-pointer whitespace-nowrap";
                }
            });
            fetchLeaderboardData();
        }

        async function fetchLeaderboardData() {
            const icon = document.getElementById('refreshIcon');
            if (icon) icon.classList.add('animate-spin');

            let rawScores = [];
            if (window.LeaderboardService && window.LeaderboardService.getTopScores) {
                rawScores = await window.LeaderboardService.getTopScores(currentMode) || [];
            }

            // 同名同國籍去重合併
            const uniqueMap = new Map();
            rawScores.forEach(item => {
                const key = `${(item.name || '').trim().toLowerCase()}_${(item.country || '').trim().toLowerCase()}`;
                if (!uniqueMap.has(key)) {
                    uniqueMap.set(key, item);
                } else {
                    const exist = uniqueMap.get(key);
                    const curScore = parseInt(item.score) || 0;
                    const existScore = parseInt(exist.score) || 0;
                    const curReact = parseInt(item.reactTime || item.react_time) || 9999;
                    const existReact = parseInt(exist.reactTime || exist.react_time) || 9999;
                    if (curScore > existScore || (curScore === existScore && curReact < existReact)) {
                        uniqueMap.set(key, item);
                    }
                }
            });

            lastScoresData = Array.from(uniqueMap.values()).sort((a, b) => {
                const aScore = parseInt(a.score) || 0;
                const bScore = parseInt(b.score) || 0;
                if (bScore !== aScore) return bScore - aScore;
                return (parseInt(a.reactTime || a.react_time) || 9999) - (parseInt(b.reactTime || b.react_time) || 9999);
            });

            renderPodium(lastScoresData.slice(0, 3));
            renderList(lastScoresData.slice(3, 20));

            refreshSeconds = 15;
            if (icon) setTimeout(() => icon.classList.remove('animate-spin'), 600);
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function renderPodium(top3) {
            const container = document.getElementById('podiumContainer');
            if (!container) return;

            if (top3.length === 0) {
                container.innerHTML = '';
                return;
            }

            const t = I18N[currentLang] || I18N['en'];
            const p1 = top3[0];
            const p2 = top3[1];
            const p3 = top3[2];

            const renderCard = (player, rank, style, badgeBg, badgeText, badgeTitle) => {
                if (!player) return `<div class="hidden md:block"></div>`;
                const isHw = player.device && player.device.includes('ESP32');
                const cCode = parseCountryCode(player.country);

                return `
                    <div class="glass-card rounded-3xl p-5 text-center relative ${style} flex flex-col items-center">
                        <div class="absolute -top-3.5 px-3 py-0.5 rounded-full ${badgeBg} ${badgeText} text-[10px] sm:text-[11px] font-black tracking-wider uppercase shadow-xs">
                            ${badgeTitle}
                        </div>
                        <img src="https://flagcdn.com/w80/${cCode}.png" class="w-12 h-8 object-cover rounded-md shadow-md mt-2 mb-3" onerror="this.src='https://flagcdn.com/w80/un.png'">
                        <h4 class="font-extrabold text-base text-gray-900 truncate max-w-[160px]" title="${player.name}">${player.name}</h4>
                        <div class="inline-flex items-center space-x-1 mt-1">
                            <span class="text-[9px] px-1.5 py-0.5 rounded-full font-bold ${isHw ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-500'}">${isHw ? 'ESP32' : 'Web'}</span>
                        </div>
                        <div class="mt-4 pt-3 border-t border-gray-200/50 w-full flex justify-around">
                            <div><div class="text-[10px] text-gray-400 font-bold uppercase">${t.score}</div><div class="text-xl font-black text-indigo-600">${player.score}</div></div>
                            <div><div class="text-[10px] text-gray-400 font-bold uppercase">${t.react}</div><div class="text-sm font-mono font-bold text-gray-700 mt-1">${player.reactTime || player.react_time || 0}ms</div></div>
                        </div>
                    </div>
                `;
            };

            container.innerHTML = `
                <!-- 2nd Place -->
                <div class="order-2 md:order-1">${renderCard(p2, 2, 'glow-silver border-gray-300 md:translate-y-2', 'bg-slate-200', 'text-slate-700', t.p2)}</div>
                <!-- 1st Place -->
                <div class="order-1 md:order-2">${renderCard(p1, 1, 'glow-gold border-amber-300 ring-2 ring-amber-400/30 scale-105 z-10', 'bg-amber-400', 'text-amber-950', t.p1)}</div>
                <!-- 3rd Place -->
                <div class="order-3 md:order-3">${renderCard(p3, 3, 'glow-bronze border-amber-200 md:translate-y-4', 'bg-amber-100', 'text-amber-800', t.p3)}</div>
            `;
        }

        function renderList(rest) {
            const list = document.getElementById('boardList');
            if (!list) return;

            const t = I18N[currentLang] || I18N['en'];

            if (rest.length === 0 && lastScoresData.length === 0) {
                list.innerHTML = `<div class="py-8 text-center text-gray-400 text-xs">${t.noData}</div>`;
                return;
            }

            list.innerHTML = rest.map((item, idx) => {
                const rank = idx + 4;
                const isHw = item.device && item.device.includes('ESP32');
                const cCode = parseCountryCode(item.country);

                return `
                    <div class="py-3 px-3 flex items-center justify-between hover:bg-white/50 rounded-2xl transition-colors">
                        <div class="flex items-center space-x-3.5 min-w-0">
                            <span class="w-6 text-center font-mono font-bold text-gray-400 text-sm shrink-0">${rank}</span>
                            <img src="https://flagcdn.com/w40/${cCode}.png" class="w-5 h-3.5 object-cover rounded shadow-xs shrink-0" onerror="this.src='https://flagcdn.com/w40/un.png'">
                            <span class="font-bold text-gray-800 text-sm truncate max-w-[140px] sm:max-w-[240px]">${item.name}</span>
                            <span class="text-[9px] px-1.5 py-0.5 rounded font-semibold shrink-0 ${isHw ? 'bg-indigo-50 text-indigo-600' : 'bg-gray-100 text-gray-500'}">${isHw ? 'ESP32' : 'Web'}</span>
                        </div>
                        <div class="text-right shrink-0 flex items-center space-x-4">
                            <div class="font-mono text-xs text-gray-400 hidden sm:block">${item.reactTime || item.react_time || 0}ms</div>
                            <div class="font-black text-indigo-600 text-sm sm:text-base">${item.score} <span class="text-[10px] font-normal text-gray-400">${t.pts}</span></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function startAutoRefresh() {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                refreshSeconds--;
                const timerElem = document.getElementById('autoTimer');
                if (timerElem) timerElem.textContent = `${refreshSeconds}s`;

                if (refreshSeconds <= 0) {
                    fetchLeaderboardData();
                }
            }, 1000);
        }

        window.onload = () => {
            switchLanguage(currentLang);
            changeMode('speed');
            startAutoRefresh();
        };
    </script>
</body>
</html>
